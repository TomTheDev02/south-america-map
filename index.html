
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our South American Journey</title>
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #25352d;
      background: #f7f5ef;
    }
    header {
      padding: 24px;
      text-align: center;
    }
    h1 { margin-bottom: 8px; }
    #map { height: 75vh; min-height: 450px; }
    #status { padding: 16px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Our South American Journey</h1>
    <p>Brazil · Argentina · Chile · Peru</p>
  </header>

  <div id="map"></div>
  <div id="status">Load your Polarsteps JSON to display the route.</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-20, -60], 3);

   

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19,
  crossOrigin: true
}).addTo(map);


    

const saoPauloPhotos = [
  'WhatsApp Image 2026-10-15 at 18.39.37 (1).jpeg',
  'WhatsApp Image 2026-10-15 at 18.39.37 (2).jpeg',
  'WhatsApp Image 2026-10-15 at 18.39.37 (3).jpeg',
  'WhatsApp Image 2026-10-15 at 18.39.37 (4).jpeg',
  'WhatsApp Image 2026-10-15 at 18.39.37 (5).jpeg',
  'WhatsApp Image 2026-10-15 at 18.39.37 (6).jpeg',
  'WhatsApp Image 2026-10-15 at 18.39.37 (7).jpeg',
  'WhatsApp Image 2026-10-15 at 18.39.37.jpeg'
].map(filename => encodeURIComponent(filename));

const saoPauloIcon = L.divIcon({
  className: '',
  html: `
    <div style="
      background:#176b45;
      color:white;
      padding:9px 13px;
      border:2px solid white;
      border-radius:8px;
      box-shadow:0 2px 8px #333;
      font-size:14px;
      font-weight:bold;
      white-space:nowrap;
    ">📍 SÃO PAULO</div>
  `,
  iconSize: [130, 38],
  iconAnchor: [65, 19]
});

const saoPauloGallery = saoPauloPhotos.map((src, i) => `
  <a href="${src}" target="_blank" rel="noopener">
    <img
      src="${src}"
      alt="São Paulo travel photo ${i + 1}"
      style="
        width:100%;
        height:110px;
        object-fit:cover;
        border-radius:6px;
        display:block;
      "
    >
  </a>
`).join('');

L.marker([-23.5505, -46.6333], { icon: saoPauloIcon })
  .addTo(map)
  .bindPopup(`
    <div style="width:320px;max-width:75vw;">
      <h3 style="margin:4px 0 8px;">São Paulo, Brazil</h3>
      <p style="margin:0 0 10px;">
        Our South American adventure began in São Paulo — the first stop
        on a trip full of unforgettable places and memories.
      </p>
      <div style="
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:7px;
      ">
        ${saoPauloGallery}
      </div>
      <p style="font-size:11px;color:#666;margin-bottom:0;">
        Select a photo to open it full size.
      </p>
    </div>
  `);

L.marker([-23.5505, -46.6333])
  .addTo(map)
  .bindPopup(`
    <div style="max-width:260px">
      <h3>São Paulo, Brazil</h3>
      <img src="${saoPauloPhoto}" alt="São Paulo" style="width:100%;border-radius:8px">
      <p>Our South American adventure began in São Paulo — the first stop on a trip full of unforgettable places and memories.</p>
    </div>
  `);

    const picker = document.createElement('input');
    picker.type = 'file';
    picker.accept = '.json,application/json';
    picker.style.display = 'block';
    picker.style.margin = '0 auto 20px';
    document.querySelector('header').appendChild(picker);

    picker.addEventListener('change', async () => {
      const status = document.getElementById('status');

      try {
        const file = picker.files[0];
        if (!file) return;

        const data = JSON.parse(await file.text());
  
const points = (data.locations || [])
  .filter(p =>
    Number.isFinite(p.lat) &&
    Number.isFinite(p.lon) &&
    Number.isFinite(p.time) &&
    p.lat >= -57 && p.lat <= 13 &&
    p.lon >= -82 && p.lon <= -34
  )
  .sort((a, b) => a.time - b.time);


        if (points.length < 2) {
          status.textContent =
            'No South American route points found in this file.';
          return;
        }

        const route = L.polyline(
          points.map(p => [p.lat, p.lon]),
          { color: '#26785c', weight: 3 }
        ).addTo(map);

        L.marker([points[0].lat, points[0].lon])
          .addTo(map).bindPopup('First recorded point');

        L.marker([
          points[points.length - 1].lat,
          points[points.length - 1].lon
        ]).addTo(map).bindPopup('Last recorded point');

        map.fitBounds(route.getBounds(), { padding: [25, 25] });
        status.textContent =
          `South American route loaded: ${points.length} GPS points.`;
      } catch (error) {
        status.textContent =
          'Could not read this JSON. Check that it is a valid Polarsteps export.';
      }
    });
  </script>
</body>
</html>
