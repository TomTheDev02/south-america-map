<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our South America Trip</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f1e9;color:#263b2e}button{cursor:pointer;font:inherit}
#cover{position:fixed;inset:0;z-index:1000;background:linear-gradient(to bottom,rgba(0,0,0,.38),transparent 38%,transparent 57%,rgba(0,0,0,.60)),url('cover.jpeg') center 48%/cover no-repeat;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:clamp(45px,8vh,85px) 35px 65px}
#cover:after{content:'';position:absolute;inset:17px;border:1px solid rgba(255,255,255,.8);pointer-events:none}#cover h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(35px,6vw,70px);letter-spacing:.04em;line-height:1.08;text-shadow:0 2px 14px #0008;margin:0;max-width:800px}#cover .year{font-size:13px;letter-spacing:.35em;text-transform:uppercase;margin-top:16px}#start{background:rgba(255,255,255,.96);color:#1e3e2e;border:0;padding:16px 33px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;position:relative;z-index:2}#start:hover{background:#e5ddc8}
#experience{display:none;position:fixed;inset:0}#map{position:absolute;inset:0}#topbar{position:absolute;z-index:500;left:16px;right:16px;top:16px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}#topbar>*{pointer-events:auto}#home,#destSelect{background:#fffdf5;border:1px solid #d7d0bf;padding:12px 15px;border-radius:5px;color:#28412e;box-shadow:0 2px 12px #0002}#destSelect{max-width:50vw}
#chapter{position:absolute;z-index:500;right:16px;top:75px;bottom:16px;width:min(380px,calc(100vw - 32px));overflow:auto;background:#fffdf6;box-shadow:0 6px 30px #0003;border-radius:7px;padding:22px;display:none}#chapter h2{font:normal 32px Georgia,serif;margin:4px 0}#chapter .country{letter-spacing:.13em;text-transform:uppercase;font-size:11px;color:#777}#chapter p{line-height:1.6}#photos{display:grid;grid-template-columns:1fr 1fr;gap:7px}#photos img{width:100%;height:135px;object-fit:cover;border-radius:3px}#nav{display:flex;gap:8px;margin-top:18px}#nav button{flex:1;padding:12px;background:#254a36;color:white;border:0;border-radius:4px}#close{float:right;border:0;background:transparent;font-size:24px}#routeControl{position:absolute;z-index:500;left:16px;bottom:18px;background:#fffdf5;padding:10px;border-radius:5px;max-width:calc(100vw - 32px);box-shadow:0 2px 12px #0002;font-size:12px}#routeControl input{max-width:200px}.place-label{display:inline-block;white-space:nowrap;background:#254a36;color:white;border:2px solid white;border-radius:5px;padding:7px 9px;font:bold 12px Arial;box-shadow:0 2px 8px #0005}#status{margin:5px 0 0;font-size:11px}
@media(max-width:650px){#cover{padding:65px 35px 60px}#cover:after{inset:12px}#chapter{top:auto;bottom:0;right:0;left:0;width:100%;max-height:58vh;border-radius:12px 12px 0 0}#routeControl{bottom:8px;left:8px;padding:6px}#routeControl input{max-width:145px}#topbar{top:8px;left:8px;right:8px}}
</style>
</head>
<body>
<section id="cover"><div><h1>Our South America Trip</h1><div class="year">2026</div></div><button id="start">Start the Trek →</button></section>
<main id="experience"><div id="map"></div><div id="topbar"><button id="home">← Cover</button><select id="destSelect" aria-label="Choose a destination"><option value="">Choose a destination</option></select></div><article id="chapter"><button id="close" aria-label="Close chapter">×</button><div class="country" id="country"></div><h2 id="placeName"></h2><p id="story"></p><div id="photos"></div><div id="nav"><button id="prev">← Previous</button><button id="next">Next stop →</button></div></article><div id="routeControl">Optional: load Polarsteps route <input id="routeFile" type="file" accept=".json,application/json"><div id="status"></div></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const destinations=[
['São Paulo','Brazil',-23.5505,-46.6333,'Our South American adventure began in São Paulo — the first stop on a trip full of unforgettable places and memories.'],
['Rio de Janeiro','Brazil',-22.9068,-43.1729,'Beaches, city life and the spectacular scenery of Rio.'],
['Porto Alegre','Brazil',-30.0346,-51.2177,'Our adventure continued in southern Brazil.'],
['Buenos Aires','Argentina',-34.6037,-58.3816,'A new country and a new chapter in Buenos Aires.'],
['Salta','Argentina',-24.7821,-65.4232,'Into the dramatic landscapes of northern Argentina.'],
['Cafayate','Argentina',-26.0728,-65.9761,'Colourful valleys and spectacular scenery.'],
['Cachi','Argentina',-25.12,-66.1667,'A small town surrounded by striking Andean landscapes.'],
['Mendoza','Argentina',-32.8895,-68.8458,'Wine country in the shadow of the Andes.'],
['Santiago','Chile',-33.4489,-70.6693,'Across the border to Chile and Santiago.'],
['Lima','Peru',-12.0464,-77.0428,'The beginning of our adventure through Peru.'],
['Paracas','Peru',-13.8369,-76.25,'Where the desert meets the Pacific.'],
['Huacachina','Peru',-14.0875,-75.7625,'A desert oasis surrounded by enormous dunes.'],
['Arequipa','Peru',-16.409,-71.5375,'Another stop on the way towards the Andes.'],
['Cusco','Peru',-13.532,-71.9675,'Our base for exploring the Peruvian Andes.'],
['Machu Picchu','Peru',-13.1631,-72.545,'After the Salkantay trek, we reached Machu Picchu.']
];
const saoPauloPhotos=['WhatsApp Image 2026-10-15 at 18.39.37 (1).jpeg','WhatsApp Image 2026-10-15 at 18.39.37 (2).jpeg','WhatsApp Image 2026-10-15 at 18.39.37 (3).jpeg','WhatsApp Image 2026-10-15 at 18.39.37 (4).jpeg','WhatsApp Image 2026-10-15 at 18.39.37 (5).jpeg','WhatsApp Image 2026-10-15 at 18.39.37 (6).jpeg','WhatsApp Image 2026-10-15 at 18.39.37 (7).jpeg','WhatsApp Image 2026-10-15 at 18.39.37.jpeg'];
const map=L.map('map',{zoomControl:false}).setView([-20,-60],4);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);
const markers=destinations.map((p,i)=>L.marker([p[2],p[3]],{icon:L.divIcon({className:'',html:`<div class="place-label">${p[0]}</div>`,iconSize:[120,32],iconAnchor:[60,16]})}).addTo(map).on('click',()=>openChapter(i)));
const select=document.getElementById('destSelect');destinations.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${p[0]}`;select.appendChild(o)});
let active=0,routeLayer=null;
function openChapter(i){active=(i+destinations.length)%destinations.length;const p=destinations[active];select.value=String(active);document.getElementById('country').textContent=p[1];document.getElementById('placeName').textContent=p[0];document.getElementById('story').textContent=p[4];document.getElementById('photos').innerHTML=active===0?saoPauloPhotos.map(f=>{const src=encodeURIComponent(f);return `<a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="São Paulo travel photo" loading="lazy"></a>`}).join(''):'';document.getElementById('chapter').style.display='block';map.flyTo([p[2],p[3]],active===14?11:11,{duration:1.8});}
document.getElementById('start').onclick=()=>{document.getElementById('cover').style.display='none';document.getElementById('experience').style.display='block';setTimeout(()=>{map.invalidateSize();map.fitBounds(L.latLngBounds(destinations.map(p=>[p[2],p[3]])),{padding:[50,50]})},60)};
document.getElementById('home').onclick=()=>{document.getElementById('experience').style.display='none';document.getElementById('cover').style.display='flex'};
document.getElementById('close').onclick=()=>document.getElementById('chapter').style.display='none';document.getElementById('prev').onclick=()=>openChapter(active-1);document.getElementById('next').onclick=()=>openChapter(active+1);select.onchange=()=>{if(select.value!=='')openChapter(Number(select.value))};
document.getElementById('routeFile').onchange=async e=>{const status=document.getElementById('status');try{const file=e.target.files[0];if(!file)return;const data=JSON.parse(await file.text());const points=(data.locations||[]).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon)&&Number.isFinite(p.time)&&p.lat>=-57&&p.lat<=13&&p.lon>=-82&&p.lon<=-34).sort((a,b)=>a.time-b.time);if(points.length<2){status.textContent='No South American route points found.';return}if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.polyline(points.map(p=>[p.lat,p.lon]),{color:'#26785c',weight:3}).addTo(map);status.textContent=`Route loaded: ${points.length} GPS points.`}catch(err){status.textContent='Could not read JSON file.'}};
</script></body></html>
